name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write  # Needed only to publish releases
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Show version information
        shell: pwsh
        run: (Get-Item build/Release/video_capture_libretro.dll).VersionInfo | Format-List CompanyName, FileDescription, FileVersion, ProductName, LegalCopyright

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/video_capture_libretro.dll dist/
          Copy-Item video_capture_libretro.info dist/

      - uses: actions/upload-artifact@v4
        with:
          name: video_capture_libretro-windows-x64
          path: dist/

      # Releases follow the version in CMakeLists.txt: on a push to main, if
      # no release exists yet for that version, zip the DLL and the .info
      # file, write their SHA-256 checksums, and publish them as a GitHub
      # Release, tagged v<version> on this commit. Publishing a new version
      # is therefore a matter of raising the version number.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(\S+ VERSION (\d+\.\d+\.\d+)'
          $version = "v" + $match.Matches[0].Groups[1].Value
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
             Write-Output "Release $version already exists."
             exit 0
          }
          $zip = "video_capture_libretro-$version-windows-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $files = @($zip, "dist/video_capture_libretro.dll", "dist/video_capture_libretro.info")
          ($files | ForEach-Object {
             "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf)
           }) | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          gh release create $version $zip SHA256SUMS.txt --target "${{ github.sha }}" --title "Video Capture Device $version" --notes-file RELEASE_NOTES.md

  linux:
    # Not a target yet; built only to keep the code portable.
    name: Linux x64 (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build
